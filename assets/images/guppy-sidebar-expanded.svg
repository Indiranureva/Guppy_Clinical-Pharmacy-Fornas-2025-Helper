<svg xmlns="http://www.w3.org/2000/svg" width="450" height="1200" viewBox="0 0 450 1200">
<title>Guppy expanded sidebar background</title>
<desc>Deep navy aquatic sidebar background with orange and blue guppy fish and teal underwater plants. No text or icons.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#193E66"/><stop offset=".55" stop-color="#102F53"/><stop offset="1" stop-color="#092746"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE16B"/><stop offset=".55" stop-color="#FFB52E"/><stop offset="1" stop-color="#F47D19"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80DDF8"/><stop offset="1" stop-color="#1976C5"/></linearGradient>
<linearGradient id="plant" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#60D0C1"/><stop offset="1" stop-color="#176D86"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#4AA5BE" stop-opacity=".22"/><stop offset="1" stop-color="#4AA5BE" stop-opacity="0"/></radialGradient>
</defs>
<rect width="450" height="1200" fill="url(#bg)"/>
<ellipse cx="225" cy="1050" rx="280" ry="300" fill="url(#glow)"/>
<path d="M0 850Q110 800 220 855T450 850V1200H0Z" fill="#1B5270" opacity=".2"/>
<g fill="none" stroke="#8ADFF0" stroke-width="3" opacity=".23"><circle cx="76" cy="810" r="9"/><circle cx="116" cy="865" r="5"/><circle cx="365" cy="780" r="7"/><circle cx="330" cy="900" r="11"/><circle cx="55" cy="1010" r="5"/></g>
